<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="m143">decision capsule · decision archive</title>
  <meta name="description" content="save a decision with its context and revisit it on a chosen day. data stays in your browser." data-i18n-content="m144">
  <meta name="theme-color" content="#f6f7f2">
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <script src="lib/i18n.js"></script>
  <script>
    const t = (key, values) => I18n.t(key, values);
    const showBootError = () => {
      const root = document.querySelector('#app');
      if (!root || root.textContent.trim()) return;
      const main = document.createElement('main');
      main.className = 'main';
      const notice = document.createElement('div');
      notice.className = 'notice notice-error';
      const title = document.createElement('strong');
      title.textContent = t("m142");
      const detail = document.createElement('p');
      detail.textContent = t("m141");
      notice.append(title, detail);
      main.append(notice);
      root.replaceChildren(main);
    };
    window.addEventListener('error', showBootError);
    window.addEventListener('unhandledrejection', showBootError);
  </script>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
